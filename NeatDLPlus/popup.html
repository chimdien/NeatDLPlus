<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=300">
  <title>Neat DL+</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <img src="img/icon16.png" alt="Neat DL+" class="header-icon" width="16" height="16">
      <span class="header-title">Neat DL+</span>
    </div>
    <button class="header-settings" id="headerSettings" title="Open Settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.5 1L6.2 2.6C5.8 2.8 5.4 3 5.1 3.3L3.5 2.7L2 5.3L3.3 6.4C3.3 6.6 3.2 6.8 3.2 7C3.2 7.2 3.2 7.4 3.3 7.6L2 8.7L3.5 11.3L5.1 10.7C5.4 11 5.8 11.2 6.2 11.4L6.5 13H9.5L9.8 11.4C10.2 11.2 10.6 11 10.9 10.7L12.5 11.3L14 8.7L12.7 7.6C12.8 7.4 12.8 7.2 12.8 7C12.8 6.8 12.8 6.6 12.7 6.4L14 5.3L12.5 2.7L10.9 3.3C10.6 3 10.2 2.8 9.8 2.6L9.5 1H6.5ZM8 5C9.1 5 10 5.9 10 7C10 8.1 9.1 9 8 9C6.9 9 6 8.1 6 7C6 5.9 6.9 5 8 5Z" fill="currentColor"/>
      </svg>
    </button>
  </header>

  <main class="content">
    <div class="row row-toggle">
      <span class="row-label">Download Catcher</span>
      <label class="toggle" for="toggleEnabled">
        <input type="checkbox" id="toggleEnabled" class="toggle-input">
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>

    <hr class="divider">

    <div class="row row-exclude">
      <label class="checkbox-label" for="excludeSite">
        <input type="checkbox" id="excludeSite" class="checkbox-input">
        <span class="checkbox-box">
          <svg class="checkbox-check" width="10" height="8" viewBox="0 0 10 8" fill="none">
            <path d="M1 3.5L3.5 6L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="checkbox-text">
          <span class="checkbox-title">Exclude this site</span>
          <span class="checkbox-hostname" id="hostnameDisplay">(loading…)</span>
        </span>
      </label>
    </div>

    <button class="settings-btn" id="openSettings">
      Open Settings
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4.5 2.5L8 6L4.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </main>

  <script src="popup.js"></script>
</body>
</html>
